<!-- Installed temporarily by the disposable fixture only. No activation file. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="org.wineexplorer.E1S6Lab"/>
    <allow send_destination="org.wineexplorer.E1S6Lab"
           send_interface="org.wineexplorer.E1S6Lab" send_member="Open"/>
    <allow send_destination="org.wineexplorer.E1S6Lab"
           send_interface="org.wineexplorer.E1S6Lab" send_member="DialogAttach"/>
  </policy>
  <policy user="root">
    <allow own="org.wineexplorer.E1S6Lab"/>
  </policy>
</busconfig>
