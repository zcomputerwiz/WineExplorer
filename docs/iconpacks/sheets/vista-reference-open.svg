<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f5f7fb"/><text x="60" y="90" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#24324a">Windows Vista / Aero — comparison sheet</text><rect x="60" y="145" width="620" height="660" rx="16" fill="#fff" stroke="#b7c5d8"/><rect x="720" y="145" width="620" height="660" rx="16" fill="#fff" stroke="#b7c5d8"/><text x="95" y="205" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#24324a">Reference icons</text><text x="95" y="260" font-family="Segoe UI,Arial" font-size="21" fill="#52647d">Not present in this checkout.</text><text x="95" y="310" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">No Vista-era official/reference icon pack</text><text x="95" y="340" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">or extracted Vista resource sheet was found.</text><text x="755" y="205" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#24324a">Open equivalent</text><text x="755" y="260" font-family="Segoe UI,Arial" font-size="21" fill="#52647d">Not present as a Vista mapping.</text><text x="755" y="310" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">The repository has src/resources/themes/aero-open</text><text x="755" y="340" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">for window chrome, but no Vista icon pack.</text><text x="60" y="855" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">Status: unavailable for side-by-side icon comparison; see the coverage and missing-icon notes.</text></svg>
