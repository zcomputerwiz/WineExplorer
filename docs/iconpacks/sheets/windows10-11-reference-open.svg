<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900"><rect width="1400" height="900" fill="#f5f7fb"/><text x="60" y="90" font-family="Segoe UI,Arial" font-size="40" font-weight="700" fill="#24324a">Windows 10 / 11 — comparison sheet</text><rect x="60" y="145" width="620" height="660" rx="16" fill="#fff" stroke="#b7c5d8"/><rect x="720" y="145" width="620" height="660" rx="16" fill="#fff" stroke="#b7c5d8"/><text x="95" y="205" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#24324a">Reference icons</text><text x="95" y="260" font-family="Segoe UI,Arial" font-size="21" fill="#52647d">Not present in this checkout.</text><text x="95" y="310" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">No Windows 10/11 official/reference icon pack</text><text x="95" y="340" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">or extracted Windows 10/11 resource sheet was found.</text><text x="755" y="205" font-family="Segoe UI,Arial" font-size="28" font-weight="700" fill="#24324a">Open equivalent</text><text x="755" y="260" font-family="Segoe UI,Arial" font-size="21" fill="#52647d">Fluent UI is a source, not a 10/11 pack.</text><text x="755" y="310" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">assets/iconpacks/fluent.json exists, but it is not</text><text x="755" y="340" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">a mapped Windows 10/11 reference set.</text><text x="60" y="855" font-family="Segoe UI,Arial" font-size="18" fill="#52647d">Status: unavailable for side-by-side icon comparison; see the coverage and missing-icon notes.</text></svg>
