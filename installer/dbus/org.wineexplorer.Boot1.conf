<!-- Startup and Recovery's settings service (scripts/wex-boot1.py): root owns the name; anyone may read the
     settings and ask to change them, which polkit's org.wineexplorer.boot1.set-startup decides. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.wineexplorer.Boot1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wineexplorer.Boot1" send_interface="org.wineexplorer.Boot1"/>
    <allow send_destination="org.wineexplorer.Boot1" send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.wineexplorer.Boot1" send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.wineexplorer.Boot1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
