<!-- Date and Time's Internet Time servers (scripts/wex-timesync1.py): root owns the name; anyone may read the servers
     and ask to change them, which polkit's org.wineexplorer.timesync1.set-servers decides. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.wineexplorer.TimeSync1"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.wineexplorer.TimeSync1" send_interface="org.wineexplorer.TimeSync1"/>
    <allow send_destination="org.wineexplorer.TimeSync1" send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow send_destination="org.wineexplorer.TimeSync1" send_interface="org.freedesktop.DBus.Properties"
           send_member="GetAll"/>
    <allow send_destination="org.wineexplorer.TimeSync1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
