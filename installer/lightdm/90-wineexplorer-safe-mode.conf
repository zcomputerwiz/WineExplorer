#
# Safe Mode's last-resort logon screen: lightdm-gtk-greeter, which wex-greeter.sh starts only when Wine cannot
# (docs/SAFE_MODE.md section 4, work order A4). Black, as XP's Safe Mode logon, with no distribution art.
# wex-greeter.sh puts this file's data directory last in XDG_DATA_DIRS for that greeter only. lightdm-gtk-greeter
# reads the data directories in order and later files override earlier ones, so these keys replace Debian's
# 01_debian.conf, and nothing under /etc changes.
[greeter]
background=#000000
user-background=false
