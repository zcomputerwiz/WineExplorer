# Installed as /etc/vintner/variants.d/advanced.conf (docs/VINTNER_BOOT.md section 4.3): with Vintner Boot as the
# loader, every generation gets a second, uncounted boot entry that starts WineExplorer's Advanced Options menu, as
# GRUB's F8 entry (11_wineexplorer_advanced) does. Vintner appends the tokens and vintner.variant=advanced to the
# generation's command line; wex-bootmode reads wexmode=. A variant boot changes no boot state. Changing this file
# makes the next `vintner publish` a new generation. Vintner puts the generation's title in front of it:
# "WineExplorer (2026-11-10): Advanced Options".
title=Advanced Options
tokens=wexmode=menu
