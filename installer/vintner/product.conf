# Installed as /etc/vintner/product.conf (docs/VINTNER_BOOT.md section 4.1): with Vintner Boot as the loader, the
# boot menu names WineExplorer instead of the installed PRETTY_NAME, which stays Debian's in /etc/os-release. The
# entries read "WineExplorer (2026-11-10)" and "WineExplorer (2026-11-10): Advanced Options" (advanced.conf). Vintner
# reads this file at every publish (its docs/product.md); a change shows on the next generation published.
name=WineExplorer
