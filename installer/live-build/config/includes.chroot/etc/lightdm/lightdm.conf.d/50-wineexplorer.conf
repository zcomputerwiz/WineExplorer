[Seat:*]
user-session=wine-explorer
greeter-session=wineexplorer-greeter
allow-guest=false
# No autologin-session: an automatic logon uses the account's own saved session, X11 or Wayland (OOBE saves
# wine-explorer, a choice on the Welcome screen replaces it), instead of always X11
autologin-user-timeout=0
