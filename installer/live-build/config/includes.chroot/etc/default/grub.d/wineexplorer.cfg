# Silent instant boot for single-OS WineExplorer installation (F8 for the Advanced Options menu)
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=1
GRUB_TERMINAL=console
GRUB_THEME=""
GRUB_BACKGROUND=""
# The menu names WineExplorer, not Debian (Debian's 10_linux appends " GNU/Linux"). /etc/os-release stays Debian's.
GRUB_DISTRIBUTOR="WineExplorer"

