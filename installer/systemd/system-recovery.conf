# Installed as /usr/lib/systemd/system.conf.d/90-wineexplorer-recovery.conf. Startup and Recovery's "Automatically
# restart" (System Properties > Advanced), on by default as on XP: when systemd itself (PID 1) crashes, it restarts the
# computer after 10 seconds instead of freezing. wex-boot1 writes /etc/systemd/system.conf.d/
# 90-wineexplorer-recovery.conf, which replaces this file, when the box is changed (freeze when it is off).
[Manager]
CrashAction=reboot
