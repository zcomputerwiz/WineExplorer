# Startup and Recovery's "Automatically restart" (System Properties > Advanced), on by default as on XP (CrashControl
# AutoReboot 1): a kernel panic restarts the computer after 10 seconds instead of waiting. wex-boot1 writes
# /etc/sysctl.d/90-wineexplorer-recovery.conf, which replaces this file, when the box is changed (0 waits).
kernel.panic = 10
