# Installed as /etc/ssh/sshd_config.d/wineexplorer.conf (docs/SAFE_MODE_WORKORDER.md C4). No network logon for root
# or the built-in Administrator account, with or without a password, and none for any account without a password.
# WineExplorer installs no SSH server; this applies only when one is installed. Debian's sshd_config reads this
# directory first, and the first value of a keyword wins.
PermitRootLogin no
DenyUsers administrator
PermitEmptyPasswords no
