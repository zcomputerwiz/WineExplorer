<svg xmlns="http://www.w3.org/2000/svg" width="101" height="64" viewBox="0 0 101 64">
  <defs>
    <linearGradient id="userGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#246ce8"/>
      <stop offset="25%" stop-color="#1456d8"/>
      <stop offset="60%" stop-color="#0842c4"/>
      <stop offset="96%" stop-color="#0032b0"/>
      <stop offset="100%" stop-color="#002488"/>
    </linearGradient>
    <linearGradient id="userShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#72acff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1456d8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Main user panel royal blue fill -->
  <rect width="101" height="62" fill="url(#userGrad)"/>
  <rect x="0" y="0" width="101" height="12" fill="url(#userShine)"/>
  <!-- 2px vibrant orange separator under the top band -->
  <rect x="0" y="62" width="101" height="2" fill="#e8841c"/>
  <line x1="0" y1="61.5" x2="101" y2="61.5" stroke="#fca834" stroke-width="1"/>
  <!-- Top corners cut with magenta for window rounding -->
  <rect x="0" y="0" width="2" height="1" fill="#FF00FF"/>
  <rect x="0" y="1" width="1" height="1" fill="#FF00FF"/>
  <rect x="99" y="0" width="2" height="1" fill="#FF00FF"/>
  <rect x="100" y="1" width="1" height="1" fill="#FF00FF"/>
</svg>
