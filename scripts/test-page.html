<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sandbox Test Page</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  h1 { font-size: 2.5rem; margin-bottom: 10px; }
  p { font-size: 1.2rem; opacity: 0.9; }
  .badge {
    display: inline-block;
    background: #00c853;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    margin-top: 15px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>WineExplorer Token Security</h1>
    <p>Microsoft Edge 32-bit (x86) Stock Sandbox Verified!</p>
    <div class="badge">SANDBOX ACTIVE (NO --no-sandbox)</div>
  </div>
</body>
</html>
