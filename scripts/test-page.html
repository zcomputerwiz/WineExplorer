<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sandbox Test Page</title>
<style>
  body {
    background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
    color: white;
    font-family: sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 30px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
    max-width: 650px;
    margin: 20px auto;
  }
  h1 { font-size: 2.2rem; margin-bottom: 10px; }
  p { font-size: 1.1rem; opacity: 0.9; margin: 8px 0; }
  .badge {
    display: inline-block;
    background: #00c853;
    color: #fff;
    padding: 6px 14px;
    border-radius: 20px;
    font-weight: bold;
    margin-top: 10px;
  }
  #token_marker {
    font-size: 1.1rem;
    padding: 10px 14px;
    margin-top: 15px;
    border-radius: 8px;
    border: 2px solid #00c853;
    width: 380px;
    text-align: center;
    background: #fff;
    color: #111;
  }
  #scroll_target {
    margin-top: 30px;
    padding: 15px;
    background: rgba(0, 200, 83, 0.3);
    border-radius: 8px;
    border: 1px dashed #00c853;
    font-weight: bold;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>WineExplorer Token Security</h1>
    <p>Microsoft Edge 32-bit (x86) Stock Sandbox Acceptance</p>
    <div class="badge">STOCK SANDBOX ACTIVE (NO --no-sandbox)</div>
    <br>
    <input id="token_marker" type="text" autofocus placeholder="Click and type marker here...">
    <br>
    <canvas id="test_canvas" width="280" height="50" style="margin-top: 15px; border-radius: 6px;"></canvas>
    <div id="scroll_target">Scroll Target: WEX-STOCK-SANDBOX-OK</div>
  </div>
  <script>
    const canvas = document.getElementById('test_canvas');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#00c853';
    ctx.fillRect(0, 0, 280, 50);
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px sans-serif';
    ctx.fillText('CANVAS 2D ACCELERATION', 35, 32);
  </script>
</body>
</html>
