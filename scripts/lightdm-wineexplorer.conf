# WineExplorer: LightDM is the display manager (docs/WINLOGON_AND_DWM.md, phase W1).
# Installed as /etc/lightdm/lightdm.conf.d/50-wineexplorer.conf by scripts/setup-default-session.sh.
[Seat:*]
user-session=wine-explorer
greeter-session=lightdm-gtk-greeter
autologin-user=wineuser
autologin-session=wine-explorer
autologin-user-timeout=0
